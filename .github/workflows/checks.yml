name: Publication checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,optimization,statistics]"
      - run: python -m pip check
      - run: python -m ruff check src/ai_cpet_ots notebooks scripts
      - run: python -m ruff format --check src/ai_cpet_ots notebooks scripts
      - run: python scripts/check_publication.py
