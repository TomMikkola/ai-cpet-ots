[build-system]
requires = ["setuptools>=77.0.3,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-CPET-OTS"
version = "0.1.0"
description = "Research models for overtraining syndrome using clinical and CPET data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "torch==2.14.0",
    "torcheval==0.0.7",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
optimization = ["GPy==1.13.2", "GPyOpt==1.2.6", "setuptools>=77.0.3,<82"]
statistics = ["statsmodels==0.15.0", "MLstatkit==0.1.91"]
dev = ["pytest>=8,<10", "ruff==0.17.4", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_cpet_ots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["AI-CPET-OTS", "src/Pre-process-BBB-ECG.ipynb", ".publication-baseline"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E402"]
# Preserve historical exception fallbacks in the standalone legacy notebook.
"notebooks/preprocess.ipynb" = ["E402", "E722"]
